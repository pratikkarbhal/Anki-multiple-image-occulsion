<div class="occ-instruction">Tap a box to reveal it</div>
<div class="occ-wrap" id="occ-images">
{{Front}}
</div>

<!-- Only {{Front}} and {{Occlusions}} are referenced — both real fields,
     so Anki's field checker stays clean. -->
<div id="occ-data" style="display:none">{{Occlusions}}</div>

<script>
setTimeout(function () {
  var raw = document.getElementById('occ-data').textContent.trim();
  var wrap = document.getElementById('occ-images');
  var imgList = wrap.getElementsByTagName('img');

  // Snapshot into a plain array first — we're about to move these nodes
  // (wrapping each in a holder), which would otherwise shift a live list.
  var imgs = [];
  for (var i = 0; i < imgList.length; i++) imgs.push(imgList[i]);

  function parseOcclusions(raw) {
    var map = {};
    var chunks = raw.split('||');
    for (var c = 0; c < chunks.length; c++) {
      var chunk = chunks[c].trim();
      if (!chunk) continue;
      var colonIdx = chunk.indexOf(':');
      if (colonIdx < 0) continue;
      var idx = parseInt(chunk.slice(0, colonIdx).trim(), 10);
      var boxParts = chunk.slice(colonIdx + 1).split(';');
      var boxes = [];
      for (var b = 0; b < boxParts.length; b++) {
        var part = boxParts[b].trim();
        if (!part) continue;
        var eqIdx = part.indexOf('=');
        var coordsStr = eqIdx >= 0 ? part.slice(0, eqIdx) : part;
        var label = eqIdx >= 0 ? part.slice(eqIdx + 1).trim() : '';
        var coords = coordsStr.split(',');
        boxes.push({
          x: parseFloat(coords[0]),
          y: parseFloat(coords[1]),
          w: parseFloat(coords[2]),
          h: parseFloat(coords[3]),
          label: label
        });
      }
      map[idx] = boxes;
    }
    return map;
  }

  var occMap = parseOcclusions(raw);

  for (var i = 0; i < imgs.length; i++) {
    var img = imgs[i];
    var idx = i + 1;
    var boxes = occMap[idx];
    if (!boxes || !boxes.length) continue;

    var holder = document.createElement('div');
    holder.className = 'occ-holder';
    img.parentNode.insertBefore(holder, img);
    holder.appendChild(img);

    for (var j = 0; j < boxes.length; j++) {
      (function (box) {
        var mask = document.createElement('div');
        mask.className = 'occ-mask' + (box.label ? '' : ' occ-blank');
        mask.style.left = box.x + '%';
        mask.style.top = box.y + '%';
        mask.style.width = box.w + '%';
        mask.style.height = box.h + '%';

        var labelSpan = document.createElement('span');
        labelSpan.className = 'occ-label';
        labelSpan.textContent = box.label;
        mask.appendChild(labelSpan);

        // Keep taps from bubbling into AnkiDroid's own gesture layer
        // (tap-to-flip / swipe) before reaching the mask.
        mask.addEventListener('touchstart', function (ev) {
          ev.stopPropagation();
        }, { passive: true });

        mask.addEventListener('click', function (ev) {
          ev.stopPropagation();
          ev.preventDefault();
          mask.classList.toggle('occ-revealed');
        });

        holder.appendChild(mask);
      })(boxes[j]);
    }
  }
}, 0);
</script>
